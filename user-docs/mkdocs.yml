site_name: Exasol Personal
site_description: Install, deploy, and use Exasol Personal
site_url: https://exasol.github.io/exasol-personal/
repo_url: https://github.com/exasol/exasol-personal
repo_name: exasol/exasol-personal

docs_dir: content
site_dir: site

theme:
  name: material
  custom_dir: overrides
  logo: assets/exasol-logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/exasol.css

nav:
  - Home: index.md
  - Get started:
      - System requirements: system-requirements.md
      - Install the launcher: getting-started.md
      - Run Exasol locally: local-deployment.md
      - Deploy to the cloud: cloud-deployment.md
  - Cloud deployments:
      - Resources and costs: cloud-resources.md
      - AWS account setup: cloud/aws.md
      - Azure account setup: cloud/azure.md
      - Exoscale account setup: cloud/exoscale.md
      - STACKIT account setup: cloud/stackit.md
  - Manage deployments: manage-deployments.md
  - Use the database:
      - Connect to the database: connect.md
      - Load sample data: load-data.md
      - UDFs and script languages: udfs.md
      - Virtual schemas: virtual-schemas.md
  - Launcher:
      - Script the launcher: scripting.md
      - Presets: presets.md
      - Runtime cache: launcher-cache.md
      - CLI reference: cli-reference.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Limitations: limitations.md
  - Reference:
      - Glossary: glossary.md
      - Release notes: release-notes.md
  - Project information:
      - Privacy and licensing: privacy-and-licensing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir/../CHANGELOG.md
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  version:
    provider: mike
    default: latest
    alias: true

remote_branch: gh-pages
