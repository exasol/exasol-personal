[project]
name = "tests"
version = "0.1.0"
description = "Integration tests for the Exasol launcher tool"
authors = [{ name = "Exasol", email = "entwicklung@exasol.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "websocket-client>=1.8.0",
    "pydantic>=2.12.0",
    "semver>=3.0.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "types-requests>=2.33.0",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(funcName)s: %(message)s"
markers = [
    "openspec(*capabilities): OpenSpec capabilities for which a test provides evidence.",
    "smoke: Critical-path provider coverage.",
    "providers(*names): Providers to which a test is restricted.",
    "platform(*names): Host platforms to which a test is restricted.",
    "chaos: Fault-injection, interruption, and recovery evidence.",
    "stress: Long-running stress/scale tests (e.g. large data import).",
]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_optional = true
no_implicit_reexport = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_subclassing_any = true
plugins = ["pydantic.mypy"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint]
extend-ignore = [
    # Test modules, classes, and functions do not need docstrings.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "LOG015", # Global logging is intentional in test infrastructure.
]
