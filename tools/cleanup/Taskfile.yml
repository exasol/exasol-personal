version: '3'

vars:
  COMMAND_NAME: exasol-cleanup
  BINARY_SUFFIX:
    sh: test "$(go env GOOS)" = "windows" && echo ".exe" || true
  BUILD_DIR_NAME: "bin"
  # golangci-lint comes from the repository's developer tools module, built with that module's toolchain
  GOLANGCI_LINT: '"$(go -C ../devtools tool -n golangci-lint)"'

tasks:
  default:
    silent: true
    cmds:
      - "task --list"

  build:
    desc: Build the cleanup binary
    cmds:
      - |
        go build -o {{.BUILD_DIR_NAME}}/{{.COMMAND_NAME}}{{.BINARY_SUFFIX}} ./cmd/cleanup

  tests-unit:
    desc: 'Run unit tests. TEST is a regex for `go test -run`.'
    cmds:
      - go test -v{{if .TEST}} -run "{{.TEST}}"{{end}} ./...

  lint-golang:
    desc: Run golangci-lint linters
    cmds:
      - '{{.GOLANGCI_LINT}} run ./...'

  lint-golang-fix:
    desc: Run golangci-lint linters and apply automatic fixes
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --fix'

  lint:
    desc: Run all linters
    cmds:
      - task: lint-golang

  fmt:
    desc: Format Go code
    cmds:
      - task: lint-golang-fix

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR_NAME}}
