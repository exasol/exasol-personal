# Github utilities
version: '3'

tasks:
  trigger-deployment-tests:
    desc: Trigger deployment tests on the current pushed commit (`task github:trigger-deployment-tests SUITE=local`, optionally with `OS=ubuntu-latest`, `OS=windows-latest`, or `OS=macos-latest`)
    vars:
      OS: '{{default "all" .OS}}'
      SUITE: '{{default "all" .SUITE}}'
    cmds:
      - .github/scripts/run-deployment-tests.sh "{{.OS}}" "{{.SUITE}}"

  trigger-launcher-tests:
    desc: Trigger the launcher tests workflow on the current pushed commit (`task github:trigger-launcher-tests OS=ubuntu-latest`)
    vars:
      OS: '{{default "all" .OS}}'
    cmds:
      - .github/scripts/run-launcher-tests.sh "{{.OS}}"
