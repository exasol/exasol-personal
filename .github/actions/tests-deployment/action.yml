name: tests-deployment
description: Run Deployment Tests
inputs:
  infra:
    description: Infrastructure preset for deployment tests.
    required: false
    default: aws
  task:
    description: Taskfile target to execute for deployment tests.
    required: false
    default: tests-deployment
  system-python:
    description: >
      Skip managed Python install and use system Python instead.
      Use on self-hosted runners that lack write access to the tool cache
      (e.g. the macOS ARM64 virtualization runner).
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Setup Python and Task
      if: ${{ inputs.system-python != 'true' }}
      uses: ./.github/actions/setup-python
    - name: Setup Task (system Python path)
      if: ${{ inputs.system-python == 'true' }}
      uses: ./.github/actions/setup-task
    - name: Install uv (system Python path)
      if: ${{ inputs.system-python == 'true' }}
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
    - name: Install Python 3.13 (system Python path)
      if: ${{ inputs.system-python == 'true' }}
      shell: bash
      run: |
        uv python install 3.13
        echo "$(dirname "$(uv python find 3.13)")" >> "$GITHUB_PATH"
    - name: Install Poetry (system Python path)
      if: ${{ inputs.system-python == 'true' }}
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: "2.4.1"
    - name: Select Python 3.13 for Poetry
      if: ${{ inputs.system-python == 'true' }}
      shell: bash
      working-directory: tests
      run: |
        python_path="$(uv python find 3.13)"
        echo "Using Python: ${python_path}"
        "${python_path}" --version
        poetry env use "${python_path}"
        poetry env info
    - name: Install test dependencies (system Python path)
      if: ${{ inputs.system-python == 'true' }}
      shell: bash
      run: task tests-setup
    - name: Run Deployment Tests
      shell: bash
      env:
        TASK_INPUT: ${{ inputs.task }}
        INFRA_INPUT: ${{ inputs.infra }}
      run: task "${TASK_INPUT}" "INFRA=${INFRA_INPUT}"
