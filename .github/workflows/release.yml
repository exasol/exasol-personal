# .github/workflows/release.yml
name: Create GH release (from existing tag)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v2.1.0 or v2.1.0-rc1). Create and push it first (admins only). A pre-release version suffix such as -rc1 marks it as a pre-release."
        required: true
      previous_tag:
        description: "Previous tag for the changelog base (e.g. v2.0.0). Leave blank to auto-detect the last stable release."
        required: false

permissions: {}

jobs:
  validate-docs:
    name: Validate release documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.request.outputs.version }}
      stability: ${{ steps.request.outputs.stability }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: user-docs/uv.lock

      - name: Validate publication request
        id: request
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(uv run --project user-docs --locked --no-build python user-docs/scripts/versions.py validate-publish "refs/tags/${TAG}")"
          stability="$(uv run --project user-docs --locked --no-build python user-docs/scripts/versions.py stability "${version}")"
          echo "Documentation version for this release: ${version} (${stability})"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "stability=${stability}" >> "${GITHUB_OUTPUT}"

      - name: Validate documentation
        run: uv run --project user-docs --locked --no-build mkdocs build --strict --config-file user-docs/mkdocs.yml

  goreleaser:
    needs: validate-docs
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Determine previous tag for changelog
        id: prev
        env:
          TAG: ${{ inputs.tag }}
          INPUT_PREV: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PREV}" ]; then
            PREV="${INPUT_PREV}"
          else
            # Highest stable (non-prerelease) tag reachable from the release tag, excluding the tag itself.
            PREV="$(git tag --merged "${TAG}" --sort=-version:refname \
              | grep -vE '-' \
              | grep -vFx "${TAG}" \
              | head -n1 || true)"
          fi
          echo "Previous tag for changelog: '${PREV:-<auto-detect by GoReleaser>}'"
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Setup CodeSignTool for Windows signing
        uses: ./.github/actions/setup-codesigntool
        with:
          version: v1.3.2
          checksum-sha256: f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a

      - name: Setup macOS signing certificate
        id: macos-signing
        uses: ./.github/actions/setup-macos-signing
        with:
          p12-key: ${{ secrets.IOS_PKCS12_IDENTITY_CERTIFICATE_BASE64_ENCODED }}
          p12-password: ${{ secrets.IOS_PKCS12_IDENTITY_CERTIFICATE_PASSWORD }}
          application-cert: ${{ secrets.IOS_CER_DEVELOPERID_APPLICATION_BASE64_ENCODED }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Override containers conf at least until github rolls out
          # 'ubuntu-24.04 version 20260810.271.1' for all instanced of
          # 'ubuntu-latest'.  At the time of writing, this is in staged rollout
          # and version 20260720.247.2 ships a v1 registries.conf that the
          # library that we use refuses.
          CONTAINERS_REGISTRIES_CONF: ${{ github.workspace }}/.github/containers/registries.conf
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_RUNNER_GITHUB_TOKEN: ${{ secrets.EXASOL_NANO_VM_TOKEN }}
          MACOS_SIGN_P12: ${{ steps.macos-signing.outputs.p12-path }}
          MACOS_SIGN_PASSWORD: ${{ secrets.IOS_PKCS12_IDENTITY_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID:  ${{ secrets.IOS_APPSTORECONNECTAPI_ISSUERID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.IOS_APPSTORECONNECTAPI_KEYID }}
          MACOS_NOTARY_KEY: ${{ secrets.IOS_APPSTORECONNECTAPI_AUTHKEY }}
          SSLCOM_USERNAME: ${{ secrets.ESIGN_USERNAME }}
          SSLCOM_PASSWORD: ${{ secrets.ESIGN_PASSWORD }}
          SSLCOM_CREDENTIAL_ID: ${{ secrets.ESIGN_CREDENTIAL_ID }}
          SSLCOM_TOTP_SECRET: ${{ secrets.ESIGN_TOTP_SECRET }}

  publish-docs:
    name: Publish release documentation
    needs:
      - validate-docs
      - goreleaser
    if: needs.validate-docs.outputs.stability == 'stable'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      operation: publish
      source_ref: refs/tags/${{ inputs.tag }}
      make_latest: auto
