name: Push to PR or main - Run full CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]

permissions: {}

# A new push cancels the previous run of the same pull request or branch,
# including main, where only the latest commit needs a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # run all go-based linters together so they can share the go setup and the cache
  lint-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Lint Go code
        run: task lint-golang
      - name: Lint Terraform code
        run: task lint-terraform

  # run all python-based together linters so they can share the python setup and the cache
  lint-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
      - name: Lint ruff
        run: task lint-ruff
      - name: Lint mypy
        run: task lint-mypy
      # the CLI reference is checked in the build job, against the launcher that
      # job already produces, so this one needs no Go toolchain
      - name: Check user documentation
        run: task docs-check-standalone

  build:
    runs-on: ubuntu-latest
    needs:
      - lint-go
      - lint-python
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # this is need because we use "git describe" to get the latest version from git
          fetch-depth: 0
      - uses: ./.github/actions/build-test-binaries
      # Checking the CLI reference here reuses the launcher binary built above,
      # instead of setting up Go and building it again in the lint job
      - uses: ./.github/actions/setup-python
      - name: Check the CLI reference
        run: |
          cp bin/linux-amd64/exasol bin/exasol
          task docs-cli-verify

  tests-unit:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/tests-unit
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage-unit.out

  tests-launcher:
    # The check name is a required status check, so it must not include the platform.
    name: tests-launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exasol-${{ matrix.platform }}
          path: bin/
      - name: Make executable
        if: runner.os != 'Windows'
        run: chmod +x bin/exasol
      - uses: ./.github/actions/tests-launcher

  sonarqube:
    runs-on: ubuntu-latest
    needs:
      - tests-unit
      - tests-launcher
    # Fork PRs and Dependabot PRs never receive repo secrets under the pull_request trigger,
    # so SONAR_TOKEN wouldn't be available anyway; skip them explicitly rather than run a scan that fails.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download unit coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-unit
      - name: Download Linux launcher coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-launcher-Linux
          path: coverage-launcher-linux
      - name: Download Windows launcher coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-launcher-Windows
          path: coverage-launcher-windows
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
