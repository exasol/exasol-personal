name: Deployment Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which test suite to run
        required: false
        default: all
        type: choice
        options:
          - all
          - cloud
          - local
      os:
        description: Operating system selector
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest

permissions: {}

env:
  STATUS_DESC: "Deployment tests testing Exasol launcher end to end"

jobs:
  plan-tests-deployment:
    runs-on: ubuntu-latest
    outputs:
      cloud_matrix: ${{ steps.plan.outputs.cloud_matrix }}
      cloud_has_rows: ${{ steps.plan.outputs.cloud_has_rows }}
      local_matrix: ${{ steps.plan.outputs.local_matrix }}
      local_has_rows: ${{ steps.plan.outputs.local_has_rows }}
    steps:
      - id: plan
        shell: bash
        env:
          SELECTED_OS_INPUT: ${{ inputs.os }}
          SELECTED_SUITE_INPUT: ${{ inputs.suite }}
        run: |
          selected_os="${SELECTED_OS_INPUT:-}"
          if [ -z "${selected_os}" ]; then
            selected_os="all"
          fi

          selected_suite="${SELECTED_SUITE_INPUT:-}"
          if [ -z "${selected_suite}" ]; then
            selected_suite="all"
          fi

          # Declarative cloud test plan. Toggle rows via "enabled" and route by "task".
          cloud_plan_json='[
            {"enabled": true,   "infra": "aws",      "os": "ubuntu-latest",  "task": "tests-deployment"},
            {"enabled": false,  "infra": "aws",      "os": "windows-latest", "task": "tests-deployment"},
            {"enabled": false,  "infra": "aws",      "os": "macos-latest",   "task": "tests-deployment"},
            {"enabled": false,  "infra": "azure",    "os": "ubuntu-latest",  "task": "tests-deployment-infrastructure"},
            {"enabled": true,   "infra": "azure",    "os": "windows-latest", "task": "tests-deployment-infrastructure"},
            {"enabled": false,  "infra": "azure",    "os": "macos-latest",   "task": "tests-deployment-infrastructure"},
            {"enabled": false,  "infra": "exoscale", "os": "ubuntu-latest",  "task": "tests-deployment-infrastructure"},
            {"enabled": false,  "infra": "exoscale", "os": "windows-latest", "task": "tests-deployment-infrastructure"},
            {"enabled": true,   "infra": "exoscale", "os": "macos-latest",   "task": "tests-deployment-infrastructure"}
          ]'

          # Runner values are arrays so hosted and multi-label self-hosted runners
          # share one matrix shape.
          local_plan_json='[
            {
              "os": "ubuntu-latest",
              "platform": "linux-amd64",
              "runner": ["ubuntu-latest"],
              "system_python": "false",
              "status_context": "tests-deployment-local-linux-amd64"
            },
            {
              "os": "windows-latest",
              "platform": "windows-amd64",
              "runner": ["windows-latest"],
              "system_python": "false",
              "status_context": "tests-deployment-local-windows-amd64"
            },
            {
              "os": "macos-latest",
              "platform": "macos-arm64",
              "runner": ["self-hosted", "macOS", "ARM64", "virtualization","osx06"],
              "system_python": "true",
              "status_context": "tests-deployment-local-self-hosted"
            }
          ]'

          cloud_matrix="$(jq -c --arg os "${selected_os}" --arg suite "${selected_suite}" '
            if $suite == "local" then
              []
            else
              map(select(.enabled == true))
              | if $os == "all" then . else map(select(.os == $os)) end
              | map(del(.enabled))
            end
          ' <<< "${cloud_plan_json}")"

          local_matrix="$(jq -c --arg os "${selected_os}" --arg suite "${selected_suite}" '
            if $suite == "cloud" then
              []
            elif $os == "all" then
              .
            else
              map(select(.os == $os))
            end
          ' <<< "${local_plan_json}")"

          cloud_count="$(jq 'length' <<< "${cloud_matrix}")"
          local_count="$(jq 'length' <<< "${local_matrix}")"

          if [ "${selected_suite}" = "cloud" ] && [ "${cloud_count}" -eq 0 ]; then
            echo "No enabled cloud deployment test row matches os=${selected_os}." >&2
            exit 1
          fi

          if [ "${selected_suite}" = "local" ] && [ "${local_count}" -eq 0 ]; then
            echo "No supported local deployment test row matches os=${selected_os}; use ubuntu-latest, windows-latest, macos-latest, or all." >&2
            exit 1
          fi

          {
            echo "cloud_matrix=${cloud_matrix}"
            echo "cloud_has_rows=$([ "${cloud_count}" -gt 0 ] && echo true || echo false)"
            echo "local_matrix=${local_matrix}"
            echo "local_has_rows=$([ "${local_count}" -gt 0 ] && echo true || echo false)"
          } >> "${GITHUB_OUTPUT}"

  tests-deployment:
    if: ${{ needs.plan-tests-deployment.outputs.cloud_has_rows == 'true' }}
    needs: plan-tests-deployment
    environment:
      name: deployment-tests
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-tests-deployment.outputs.cloud_matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write # Required for cloud OIDC auth
      contents: read # Required for actions/checkout
      statuses: write # Required for status updates
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # this is need because we use "git describe" to get the latest version from git
          fetch-depth: 0
      - uses: ./.github/actions/status-set
        with:
          context: tests-deployment-${{ matrix.infra }}-${{ matrix.os }}
          status: pending
          description: ${{ env.STATUS_DESC }}
          target-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: ./.github/actions/setup-aws
        if: ${{ matrix.infra == 'aws' }}
        with:
          aws-ci-role: ${{ vars.AWS_CI_ROLE_PLATFORM }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Azure credentials
        if: ${{ matrix.infra == 'azure' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure location input
        if: ${{ matrix.infra == 'azure' }}
        shell: bash
        env:
          SECRET_AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
        run: |
          location="${{ vars.AZURE_LOCATION }}"
          source="vars.AZURE_LOCATION"
          if [ -z "${location}" ]; then
            location="${SECRET_AZURE_LOCATION}"
            source="secrets.AZURE_LOCATION"
          fi

          if [ -z "${location}" ]; then
            echo "AZURE_LOCATION is required for Azure deployment tests (set vars.AZURE_LOCATION or secrets.AZURE_LOCATION, e.g. westeurope)."
            exit 1
          fi

          echo "Using Azure location from ${source}"
          echo "TF_VAR_location=${location}" >> "$GITHUB_ENV"

      - name: Setup Exoscale credentials
        if: ${{ matrix.infra == 'exoscale' }}
        shell: bash
        env:
          SECRET_EXOSCALE_API_KEY: ${{ secrets.EXOSCALE_API_KEY }}
          SECRET_EXOSCALE_API_SECRET: ${{ secrets.EXOSCALE_API_SECRET }}
        run: |
          echo "EXOSCALE_API_KEY=${SECRET_EXOSCALE_API_KEY}" >> "$GITHUB_ENV"
          echo "EXOSCALE_API_SECRET=${SECRET_EXOSCALE_API_SECRET}" >> "$GITHUB_ENV"
          # The Exoscale preset uses an aliased AWS provider for SOS endpoint resources.
          echo "AWS_ACCESS_KEY_ID=${SECRET_EXOSCALE_API_KEY}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${SECRET_EXOSCALE_API_SECRET}" >> "$GITHUB_ENV"

      # Doing a second build here again. In theory, we could
      # upload the build artifact from the ci.yml workflow
      # and fetch it here. However, for now the build run time
      # is short and we can afford building it a second time.
      - uses: ./.github/actions/build
      - uses: ./.github/actions/tests-deployment
        env:
          ARM_USE_OIDC: ${{ matrix.infra == 'azure' && 'true' || '' }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          infra: ${{ matrix.infra }}
          task: ${{ matrix.task }}

      - uses: ./.github/actions/status-set
        if: always()
        with:
          context: tests-deployment-${{ matrix.infra }}-${{ matrix.os }}
          status: ${{ job.status }}
          description: ${{ env.STATUS_DESC }}
          target-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  tests-deployment-local:
    if: ${{ needs.plan-tests-deployment.outputs.local_has_rows == 'true' }}
    needs: plan-tests-deployment
    environment:
      name: deployment-tests
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-tests-deployment.outputs.local_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/status-set
        with:
          context: ${{ matrix.status_context }}
          status: pending
          description: ${{ env.STATUS_DESC }}
          target-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: ./.github/actions/build
      - uses: ./.github/actions/tests-deployment
        with:
          infra: local
          task: tests-deployment-local
          system-python: ${{ matrix.system_python }}

      - uses: ./.github/actions/status-set
        if: always()
        with:
          context: ${{ matrix.status_context }}
          status: ${{ job.status }}
          description: ${{ env.STATUS_DESC }}
          target-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
