name: Podman teardown investigation
on:
  push:
    branches: [nh.podman-teardown-probe_SPOT-33528]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build
      - name: Verify launcher destruction before and after host repair
        shell: bash
        run: |
          set -euo pipefail
          deployment="${RUNNER_TEMP}/exasol-teardown-deployment"
          bin/exasol install local --container-engine podman --auto-approve --deployment-dir "$deployment"
          container=$(podman ps --filter name=exasol-db- --format '{{.Names}}')
          test -n "$container"
          network="${container}-services"
          podman network inspect "$network"
          if bin/exasol destroy --auto-approve --deployment-dir "$deployment" > "${RUNNER_TEMP}/destroy-before.log" 2>&1; then
            echo '::error::Expected uncorrected Ubuntu 26.04 destruction to fail'
            exit 1
          fi
          cat "${RUNNER_TEMP}/destroy-before.log"
          grep -F 'rootless netns: kill network process: permission denied' "${RUNNER_TEMP}/destroy-before.log"
          podman ps -a
          podman network inspect "$network"
          test -d "$deployment/local/runtime/exa"
          bash .github/scripts/prepare-rootless-podman.sh
          bin/exasol destroy --auto-approve --deployment-dir "$deployment"
          if podman container exists "$container"; then exit 1; fi
          if podman network exists "$network"; then exit 1; fi
          test ! -e "$deployment/local"
          test -d "$deployment"
          bin/exasol status --json --deployment-dir "$deployment" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data); assert data["status"] == "initialized"'
          bin/exasol remove --auto-approve --deployment-dir "$deployment"
          test ! -d "$deployment"
      - name: Kernel evidence and guaranteed cleanup
        if: always()
        shell: bash
        run: |
          sudo journalctl -k --since '-25 minutes' --no-pager | grep -Ei 'apparmor|DENIED|podman|pasta' || true
          bash .github/scripts/prepare-rootless-podman.sh
          if [ -d "${RUNNER_TEMP}/exasol-teardown-deployment" ]; then
            bin/exasol destroy --remove --auto-approve --deployment-dir "${RUNNER_TEMP}/exasol-teardown-deployment"
          fi
          podman ps -a
          podman network ls
