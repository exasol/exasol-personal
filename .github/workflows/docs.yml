# .github/workflows/docs.yml
name: Publish documentation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Action to run: publish or delete"
        required: true
        type: choice
        options:
          - publish
          - delete
      source_ref:
        description: "Exact tag, e.g. docs/v2.2.0 or docs/0.1; full 40-character SHA also accepted"
        required: false
        type: string
      version:
        description: "SemVer without v, e.g. 2.2.0; required for delete and optional for v-tags"
        required: false
        type: string
      make_latest:
        description: "Give this version the 'latest' alias and the site root"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - "yes"
          - "no"

permissions: {}

concurrency:
  group: documentation-publication
  cancel-in-progress: false
  queue: max

jobs:
  update-version-catalog:
    name: Update version catalog
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write
    steps:
      - name: Checkout documentation snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.operation == 'publish' && inputs.source_ref || 'refs/heads/main' }}

      - name: Validate documentation source
        if: inputs.operation == 'publish'
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::source_ref must be an exact Git tag or full 40-character commit SHA"
            exit 1
          }
          commit="$(git rev-parse HEAD)"
          if [[ "${SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            [[ "${commit,,}" == "${SOURCE_REF,,}" ]] || fail
          else
            tag="${SOURCE_REF#refs/tags/}"
            if [[ "${SOURCE_REF}" == refs/* && "${SOURCE_REF}" != refs/tags/* ]]; then
              fail
            fi
            tag_commit="$(git rev-parse --verify --end-of-options "refs/tags/${tag}^{commit}")" || fail
            [[ "${tag_commit}" == "${commit}" ]] || fail
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: user-docs/uv.lock

      - name: Prepare publication request
        id: request
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" == "publish" ]]; then
            arguments=("${SOURCE_REF}" --make-latest "${MAKE_LATEST}")
            if [[ -n "${REQUESTED_VERSION}" ]]; then
              arguments+=(--version "${REQUESTED_VERSION}")
            fi
            version="$(uv run --project user-docs --locked --no-build python user-docs/scripts/versions.py validate-publish "${arguments[@]}")"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
          else
            version="$(uv run --project user-docs --locked --no-build python user-docs/scripts/versions.py validate-delete "${REQUESTED_VERSION}")"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate documentation
        if: inputs.operation == 'publish'
        run: uv run --project user-docs --locked --no-build mkdocs build --strict --config-file user-docs/mkdocs.yml

      - name: Summarize request
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_REF: ${{ inputs.source_ref }}
          COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.request.outputs.version }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          {
            echo "## Documentation publication"
            echo ""
            echo "- Operation: \`${OPERATION}\`"
            echo "- Version: \`${VERSION}\`"
            if [[ "${OPERATION}" == "publish" ]]; then
              echo "- Source: \`${SOURCE_REF}\`"
              echo "- Commit: \`${COMMIT}\`"
              echo "- Make latest: \`${MAKE_LATEST}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure publication identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Fetch published versions
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
          elif [[ "${OPERATION}" == "delete" ]]; then
            echo "::error::No published documentation versions exist"
            exit 1
          fi

      - name: Update published versions
        env:
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ steps.request.outputs.version }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail
          arguments=("${OPERATION}" "${VERSION}")
          if [[ "${OPERATION}" == "publish" ]]; then
            arguments+=(--make-latest "${MAKE_LATEST}")
          fi
          uv run --project user-docs --locked --no-build python user-docs/scripts/versions.py "${arguments[@]}"
          git push origin gh-pages

      - name: Export complete published site
        run: git worktree add --detach "${RUNNER_TEMP}/pages" gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Deploy GitHub Pages
    needs: update-version-catalog
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
